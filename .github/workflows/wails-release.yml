name: Wails v3 Windows Release Workflow

on:
  push:
    branches:
      - '**' # 監聽所有分支推送
    tags:
      - 'v*' # 當打上 v 開頭的語意化標籤時觸發 (例如 v1.0.0)

jobs:
  build-and-release:
    name: Build & Release Windows App (Taskfile Core)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取歷史紀錄以利 Git Tag 與 Commit 解析

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # 與 go.mod 一致

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 與本地 LTS 環境一致

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3 CLI
        working-directory: bomix-app
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      # ⭐ 核心邏輯：動態解析版本號 SSOT 與判定正式/測試發布
      - name: Determine Release Variables
        id: determine_env
        shell: pwsh
        run: |
          git fetch origin main --depth=1

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            # 情況 A：由 v* Tag 觸發
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart("v")
            $zipTag = if ($tag.StartsWith("v")) { $tag } else { "v$tag" }
            Write-Host "Triggered by Git Tag: $tag (App Version: $ver)"
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ZIP_NAME=BOMIX_${zipTag}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

            # 檢查當前 Tag 是否在 main 分支歷史中
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -eq 0) {
              "RELEASE_NAME=Release $tag" | Out-File -FilePath $env:GITHUB_ENV -Append
              "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              "RELEASE_NAME=Release $tag (Beta)" | Out-File -FilePath $env:GITHUB_ENV -Append
              "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
            # 情況 B：由 main 分支直接 push 觸發
            "VERSION=main-latest" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_TAG=main-latest" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ZIP_NAME=BOMIX_main-latest.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_NAME=Main 最新穩定版" | Out-File -FilePath $env:GITHUB_ENV -Append
            "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            # 情況 C：由其他分支直接 push 觸發
            $branch = "${{ github.ref_name }}"
            $safeBranch = $branch -replace '[^a-zA-Z0-9_.-]', '-'
            "VERSION=$safeBranch" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_TAG=${safeBranch}-beta-latest" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ZIP_NAME=BOMIX_${safeBranch}-beta-latest.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_NAME=${branch} 分支 自動測試版 (Beta)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # 🚀 以 Taskfile 為唯一核心執行統一建置流程
      # 自動觸發：前端 npm build、info.json 版本同步、syso 生成、Go -ldflags 注入
      - name: Build Application via Taskfile
        working-directory: bomix-app
        shell: pwsh
        run: |
          Write-Host "執行 Taskfile 建置，注入 VERSION=$env:VERSION ..."
          task build VERSION=$env:VERSION

      # 📖 建置使用者手冊 (PDF)
      - name: Build User Manual (PDF)
        working-directory: manual
        shell: pwsh
        run: |
          Write-Host "執行手冊建置，確保產出最新 PDF..."
          try {
            node build.js
          } catch {
            Write-Warning "手冊建置過程出現警告，確認是否有既有 PDF 產物"
          }
          if (-not (Test-Path "dist/BOMIX-使用者手冊.pdf")) {
            Write-Error "錯誤：未找到手冊 PDF 檔案 (manual/dist/BOMIX-使用者手冊.pdf)"
            exit 1
          }

      # 📦 封裝 Windows 發布包（僅打包 BOMIX.exe 與 manual PDF，嚴格排除 HTML）
      - name: Package Windows Binary (ZIP)
        shell: pwsh
        run: |
          $zipName = $env:ZIP_NAME
          if (-not $zipName) {
            $zipName = "${{ env.ZIP_NAME }}"
          }
          if (-not $zipName -and $env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG
            $zipTag = if ($tag.StartsWith("v")) { $tag } else { "v$tag" }
            $zipName = "BOMIX_${zipTag}.zip"
          }
          if (-not $zipName) {
            $zipName = "BOMIX.zip"
          }
          Write-Host "目標 ZIP 檔案名稱: $zipName"

          $stagingDir = "release-staging"
          if (Test-Path $stagingDir) { Remove-Item -Path $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingDir | Out-Null

          # 1. 複製 BOMIX.exe
          $exeSource = "bomix-app/bin/BOMIX.exe"
          if (Test-Path $exeSource) {
            Copy-Item -Path $exeSource -Destination $stagingDir
            Write-Host "已加入主程式: $exeSource"
          } else {
            Write-Error "錯誤：未找到編譯輸出檔案 $exeSource"
            exit 1
          }

          # 2. 複製說明書 PDF（僅打包 PDF，排除 HTML）
          $pdfSource = "manual/dist/BOMIX-使用者手冊.pdf"
          if (Test-Path $pdfSource) {
            Copy-Item -Path $pdfSource -Destination $stagingDir
            Write-Host "已加入說明書 PDF: $pdfSource"
          } else {
            Write-Error "錯誤：未找到手冊 PDF 檔案 $pdfSource"
            exit 1
          }

          # 3. 安全防呆檢查：嚴格驗證打包內容，確保絕無 HTML 檔案
          $stagedFiles = Get-ChildItem -Path $stagingDir
          Write-Host "`n=== 發布包內容清單 ==="
          foreach ($file in $stagedFiles) {
            $mb = [math]::Round($file.Length / 1MB, 2)
            Write-Host " - $($file.Name) ($mb MB)"
          }

          $htmlFiles = @($stagedFiles | Where-Object { $_.Extension -match '^\.html?$' })
          if ($htmlFiles.Count -gt 0) {
            Write-Error "安全檢查失敗：打包清單中含有 HTML 檔案，違反打包規範！"
            exit 1
          }

          # 4. 壓縮為 ZIP
          if (Test-Path $zipName) { Remove-Item -Path $zipName -Force }
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          $zipSize = [math]::Round((Get-Item $zipName).Length / 1MB, 2)
          Write-Host "`n成功封裝發布包: $zipName ($zipSize MB)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            ${{ env.ZIP_NAME }}
            BOMIX_*.zip
            manual/dist/BOMIX-使用者手冊.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
